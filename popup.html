<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    --blue: #2563eb; --blue-hover: #1d4ed8; --blue-soft: #eff4ff;
    --ink: #0f172a; --sub: #475569; --muted: #64748b; --help: #64748b;
    --line: #e2e8f0; --field: #f8fafc; --field-hover: #f1f5f9;
    --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-ink: #92400e; --warn-sub: #78350f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { width: 360px; height: 600px; display: flex; flex-direction: column; margin: 0; overflow: hidden; font: 500 13px/1.5 "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif; letter-spacing: 0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; color: var(--ink); background: #fff; }
  button, textarea, input { font-family: inherit; }
  header { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
  header h1 { flex: 1; margin: 0; font-size: 14px; font-weight: 700; }
  #hcount { color: var(--muted); font-size: 12px; }
  /* 내용이 넘쳐도 아래 한도·보내기 영역은 항상 보이도록, 넘친 부분은 이 칸 안에서 스크롤 */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px; overflow-y: auto; }
  .top { flex: none; }
  footer { flex: none; padding: 10px 16px 12px; border-top: 1px solid var(--line); background: #fff; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  button:disabled { opacity: .45; cursor: default; }
  button svg { flex: none; }

  /* 안내/진행/오류 메시지 자리 */
  #msg { margin: 0 0 10px; }
  .msg { border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5; }
  .msg.info { background: var(--blue-soft); color: var(--ink); }
  .msg.plain { white-space: pre-wrap; }
  .msg .head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .msg .sub { margin: 8px 0 0; color: var(--sub); font-size: 12px; }
  .steps { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .step { display: flex; align-items: center; gap: 5px; }
  .num { width: 20px; height: 20px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
  .chev { color: var(--muted); }
  .spin { width: 14px; height: 14px; flex: none; border: 2px solid #bfdbfe; border-top-color: var(--blue); border-radius: 50%; animation: spin .9s linear infinite; }
  .ptrack { height: 6px; margin-top: 8px; border-radius: 3px; background: #dbeafe; overflow: hidden; }
  .pfill { width: 40%; height: 100%; border-radius: 3px; background: var(--blue); animation: slide 1.4s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .msg.error { background: var(--warn-bg); border: 1px solid var(--warn-line); }
  .msg.error .head { color: var(--warn-ink); font-weight: 700; }
  .msg.error .sub { margin-top: 4px; color: var(--warn-sub); }
  .msg.error .more { margin: 4px 0 0; padding: 2px 0; background: transparent; color: var(--warn-ink); font-size: 12px; font-weight: 600; text-decoration: underline; justify-content: flex-start; border-radius: 4px; }
  .msg.error .detail { margin: 4px 0 0; font-size: 11px; color: var(--warn-sub); word-break: break-all; white-space: pre-wrap; }

  #load { width: 100%; background: var(--blue); color: #fff; font-weight: 600; padding: 12px; font-size: 14px; }
  #load:hover:not(:disabled) { background: var(--blue-hover); }

  hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }

  .field-label { margin: 0 0 6px; font-weight: 600; font-size: 13px; }
  .field-label span { margin-left: 4px; color: var(--muted); font-weight: 400; font-size: 12px; }
  textarea { width: 100%; height: 56px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); font-size: 13px; font-weight: 500; line-height: 1.5; resize: vertical; }
  textarea::placeholder { color: var(--muted); font-weight: 400; }
  textarea:focus { outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }

  /* 누르는 버튼임이 분명하도록: 흰 바탕 + 파란 테두리 + 파란 글자 */
  #addManual { width: 100%; margin-top: 10px; padding: 9px 12px; background: #fff; color: var(--blue); border: 1.5px solid var(--blue); font-weight: 600; }
  #addManual:hover { background: var(--blue-soft); }

  .bar { flex: none; display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; color: var(--sub); font-size: 12px; }
  .bar label { display: flex; align-items: center; gap: 6px; flex: 1; cursor: pointer; }
  #clear { padding: 3px 10px; border-radius: 8px; background: var(--field); color: var(--sub); border: 1px solid var(--line); font-size: 12px; }
  #clear:hover { background: var(--field-hover); }
  input[type=checkbox] { accent-color: var(--blue); width: 14px; height: 14px; margin: 0; flex: none; }

  #list { flex: 1; min-height: 60px; overflow-y: auto; margin-bottom: 4px; border: 1px solid var(--line); border-radius: 10px; }
  #list label { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
  #list label:last-child { border-bottom: 0; }
  #list label:hover { background: var(--field); }
  #list .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #empty { padding: 16px 8px; text-align: center; color: var(--muted); }

  .limit { display: flex; align-items: center; gap: 8px; margin: 0 0 3px; color: var(--sub); font-size: 12px; }
  #limits { display: flex; gap: 6px; }
  #limits button { min-width: 64px; padding: 6px 10px; border-radius: 8px; border: 1.5px solid #cbd5e1; background: #fff; color: var(--ink); font-size: 12px; font-weight: 500; }
  #limits button:hover { background: var(--field-hover); }
  #limits button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .limit-help { margin: 0 0 8px; color: var(--help); font-size: 12px; font-weight: 400; }

  #send { width: 100%; background: var(--blue); color: #fff; font-weight: 600; padding: 12px; font-size: 14px; }
  #send:hover:not(:disabled) { background: var(--blue-hover); }
</style>
</head>
<body>
  <header>
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d55"/><stop offset=".5" stop-color="#9646f0"/><stop offset="1" stop-color="#286eff"/></linearGradient></defs>
      <rect width="24" height="24" rx="6" fill="url(#g)"/>
      <path d="M8.5 6.5l8 5-8 5z" fill="#fff"/>
      <circle cx="17.5" cy="17.5" r="4.2" fill="#ffcc00"/>
      <path d="M17.5 15.4v4.2M15.4 17.5h4.2" stroke="#282838" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <h1>재생목록 → 노트북 보내기</h1>
    <span id="hcount">0개</span>
  </header>
  <main>
    <div class="top">
    <div id="msg" aria-live="polite">
      <div class="msg info">
        <div class="steps">
          <span class="step"><span class="num">1</span>불러오기</span>
          <span class="chev">›</span>
          <span class="step"><span class="num">2</span>고르기</span>
          <span class="chev">›</span>
          <span class="step"><span class="num">3</span>보내기</span>
        </div>
        <p class="sub">유튜브 재생목록 페이지를 연 뒤 시작하세요.</p>
      </div>
    </div>

    <button id="load">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
      <span id="loadLabel">현재 페이지에서 불러오기</span>
    </button>

    <hr>

    <p class="field-label">URL 직접 입력<span>(여러 줄 / 공백 구분)</span></p>
    <textarea id="manual" aria-label="URL 직접 입력" placeholder="YouTube 영상 · shorts · youtu.be 및 일반 웹페이지"></textarea>
    <button id="addManual">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      입력한 URL을 목록에 추가
    </button>

    </div>

    <div class="bar">
      <label><input type="checkbox" id="all" checked> 전체 선택</label>
      <span id="count">0 / 0</span>
      <button id="clear">비우기</button>
    </div>
    <div id="list"><div id="empty">목록이 비어 있습니다.</div></div>

  </main>
  <footer>
    <div class="limit">
      <span>소스 한도</span>
      <div id="limits" role="group" aria-label="소스 한도">
        <button type="button" data-v="50" aria-pressed="true">50개</button>
        <button type="button" data-v="100" aria-pressed="false">100개</button>
        <button type="button" data-v="300" aria-pressed="false">300개</button>
      </div>
    </div>
    <p class="limit-help">노트북 하나에 넣을 수 있는 소스 수예요. 처음엔 50개(무료)예요. Plus는 100개, Pro는 300개를 고르세요.</p>
    <button id="send" disabled>선택한 항목 NotebookLM으로 보내기</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
